[project]
name = "ihatevideos"
version = "0.7.0"
description = "Add your description here"
authors = [
    { name = "Banned104", email = "1286253605@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aria2>=0.0.1b0",
    "aria2p>=0.12.1",
    "bilibili-api-python>=17.4.2",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "qwen-asr>=0.0.6",
    "requests>=2.34.2",
    "torch>=2.14.1",
    "yt-dlp>=2026.8.19",
    "yutto==2.1.1",
]

[project.scripts]
ihatevideos = "ihatevideos:main"
ihatevideos-input = "ihatevideos.input.cli:main"
ihatevideos-export = "ihatevideos.export.cli:main"
ihatevideos-media = "ihatevideos.media.cli:main"
ihatevideos-download = "ihatevideos.download.cli:main"
ihatevideos-stt = "ihatevideos.stt.cli:main"
ihatevideos-summarize = "ihatevideos.summarize.cli:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true